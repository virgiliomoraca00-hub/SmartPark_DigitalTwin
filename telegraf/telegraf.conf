# ============================================================
#  TELEGRAF — Bridge MQTT → InfluxDB
#  Si iscrive ai topic dei sensori su Mosquitto e scrive
#  i dati in InfluxDB nel bucket "sensor-data".
# ============================================================

[agent]
  interval        = "5s"
  flush_interval  = "10s"
  omit_hostname   = true

# ── INPUT: MQTT Consumer ────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["smart-park/+/telemetry"]
  qos     = 1

  # Nome del measurement in InfluxDB
  name_override = "sensor_reading"

  # Parsing JSON del payload
  data_format = "json"

  # sensor_id diventa tag (non field) per query efficienti
  tag_keys = ["sensor_id"]

  # timestamp viene preso dal campo "timestamp" del payload
  json_time_key    = "timestamp"
  json_time_format = "2006-01-02T15:04:05.999999999Z07:00"

# ── OUTPUT: InfluxDB v2 ─────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "smart-park-token-12345"
  organization = "smart-park"
  bucket       = "sensor-data"
