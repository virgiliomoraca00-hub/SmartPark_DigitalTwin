# ============================================================
#  SMART PARK - Digital Twin Stack
#  Componenti:
#    - Mosquitto           : MQTT Broker (Real World gateway)
#    - MongoDB             : Persistence per Ditto
#    - Eclipse Ditto       : Digital Twin engine (5 microservizi)
#      ├─ ditto-policies   : gestione policy di accesso
#      ├─ ditto-things     : gestione dei Digital Twin
#      ├─ ditto-search     : ricerca sui Twin
#      ├─ ditto-connectivity: connessioni esterne (MQTT etc.)
#      ├─ ditto-gateway    : HTTP/WebSocket API (porta 8080)
#      └─ nginx            : reverse proxy + basic auth
#    - InfluxDB            : Time-series storage
#    - Telegraf            : Bridge MQTT → InfluxDB
#    - Grafana             : Dashboard
#    - Node-RED            : Simulatore sensori MQTT
#    - MQTT Explorer       : Debug UI per MQTT
# ============================================================

networks:
  iot-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  mongodb-data:
  influxdb-data:
  grafana-data:

services:

  # ─────────────────────────────────────────
  # 1. MOSQUITTO — MQTT Broker
  #    Porta 1883 (MQTT) | 9001 (WebSocket)
  # ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 3. MONGODB — Persistence per Eclipse Ditto
  #    Porta 27017
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ditto
      MONGO_INITDB_ROOT_PASSWORD: ditto-secret
    volumes:
      - mongodb-data:/data/db
    networks:
      - iot-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # 4. ECLIPSE DITTO — Digital Twin Engine
  #    5 microservizi + nginx reverse proxy
  #    API accessibile su porta 8080
  # ─────────────────────────────────────────

  # 4a. Policies — gestione accessi/policy
  ditto-policies:
    image: docker.io/eclipse/ditto-policies:3.5.0
    container_name: ditto-policies
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-policies -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4b. Things — gestione Digital Twin
  ditto-things:
    image: docker.io/eclipse/ditto-things:3.5.0
    container_name: ditto-things
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-things -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      - ditto-policies
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4c. Things-Search — ricerca sui Twin
  ditto-search:
    image: docker.io/eclipse/ditto-things-search:3.5.0
    container_name: ditto-search
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-search -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      - ditto-policies
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4d. Connectivity — connessioni esterne (MQTT, AMQP...)
  ditto-connectivity:
    image: docker.io/eclipse/ditto-connectivity:3.5.0
    container_name: ditto-connectivity
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-connectivity -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      - ditto-policies
      - ditto-things
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4e. Gateway — HTTP + WebSocket API
  ditto-gateway:
    image: docker.io/eclipse/ditto-gateway:3.5.0
    container_name: ditto-gateway
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - ENABLE_PRE_AUTHENTICATION=true
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-gateway -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551 -Dditto.gateway.authentication.devops.password=devops
    depends_on:
      - ditto-policies
      - ditto-things
      - ditto-search
      - ditto-connectivity
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4f. Nginx — reverse proxy + basic auth su porta 8080
  nginx:
    image: nginx:1.25-alpine
    container_name: ditto-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.htpasswd:/etc/nginx/nginx.htpasswd:ro
    depends_on:
      - ditto-gateway
    networks:
      - iot-net

# 4g. Ditto-UI — Interfaccia Web su porta 8081
  ditto-ui:
    image: docker.io/eclipse/ditto-ui:3.5.0
    container_name: ditto-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - DITTO_ENDPOINT=http://localhost:8080
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 5. INFLUXDB — Time-Series Storage
  #    Porta 8086 (HTTP API + UI)
  # ─────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin-secret
      DOCKER_INFLUXDB_INIT_ORG: smart-park
      DOCKER_INFLUXDB_INIT_BUCKET: sensor-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: smart-park-token-12345
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - iot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # 6. TELEGRAF — Bridge MQTT → InfluxDB
  #    Si iscrive ai topic MQTT e scrive su InfluxDB
  # ─────────────────────────────────────────
  telegraf:
    image: telegraf:1.30-alpine
    container_name: telegraf
    restart: unless-stopped
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 7. GRAFANA — Dashboard
  #    Porta 3000
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 8. MQTT EXPLORER — Debug UI
  #    Porta 4000
  # ─────────────────────────────────────────
  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer
    container_name: mqtt-explorer
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      - iot-net

#─── Node-RED (Simulatore Sensori MQTT) ──────────
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered_data:/data
    networks:
      iot-net:
        aliases:
          - nodered
    environment:
      - TZ=Europe/Rome
