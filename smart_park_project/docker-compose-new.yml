version: '3.8'

# ============================================================
#  SMART PARK - Digital Twin Stack
#  Componenti:
#    - Mosquitto           : MQTT Broker (Real World gateway)
#    - RabbitMQ            : AMQP 0.9.1 Broker
#    - MongoDB             : Persistence per Ditto
#    - Eclipse Ditto       : Digital Twin engine (5 microservizi)
#      ├─ ditto-policies   : gestione policy di accesso
#      ├─ ditto-things     : gestione dei Digital Twin
#      ├─ ditto-search     : ricerca sui Twin
#      ├─ ditto-connectivity: connessioni esterne (MQTT etc.)
#      ├─ ditto-gateway    : HTTP/WebSocket API (porta 8080)
#      └─ nginx            : reverse proxy + basic auth
#    - InfluxDB            : Time-series storage
#    - Grafana             : Dashboard
#    - MQTT Explorer       : Debug UI per MQTT
# ============================================================

networks:
  iot-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  rabbitmq-data:
  mongodb-data:
  influxdb-data:
  grafana-data:

services:

  # ─────────────────────────────────────────
  # 1. MOSQUITTO — MQTT Broker
  #    Porta 1883 (MQTT) | 9001 (WebSocket)
  # ─────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 2. RABBITMQ — AMQP 0.9.1 Broker
  #    Porta 5672 (AMQP) | 15672 (UI)
  # ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hono
      RABBITMQ_DEFAULT_PASS: hono-secret
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - iot-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # 3. MONGODB — Persistence per Eclipse Ditto
  #    Porta 27017
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ditto
      MONGO_INITDB_ROOT_PASSWORD: ditto-secret
    volumes:
      - mongodb-data:/data/db
    networks:
      - iot-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # 4. ECLIPSE DITTO — Digital Twin Engine
  #    5 microservizi + nginx reverse proxy
  #    API accessibile su porta 8080
  # ─────────────────────────────────────────

  # 4a. Policies — gestione accessi/policy
  ditto-policies:
    image: docker.io/eclipse/ditto-policies:3.5.0
    container_name: ditto-policies
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-policies -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4b. Things — gestione Digital Twin
  ditto-things:
    image: docker.io/eclipse/ditto-things:3.5.0
    container_name: ditto-things
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-things -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      - ditto-policies
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4c. Things-Search — ricerca sui Twin
  ditto-search:
    image: docker.io/eclipse/ditto-things-search:3.5.0
    container_name: ditto-search
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-search -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      - ditto-policies
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4d. Connectivity — connessioni esterne (MQTT, AMQP...)
  ditto-connectivity:
    image: docker.io/eclipse/ditto-connectivity:3.5.0
    container_name: ditto-connectivity
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://ditto:ditto-secret@mongodb:27017/ditto?authSource=admin
      - CONNECTIVITY_MESSAGE_MAPPING_JS_COMMON_JS_MODULE_PATH=/opt/ditto/js
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-connectivity -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551
    depends_on:
      - ditto-policies
      - ditto-things
    volumes:
      - ./mappers/commonjs:/opt/ditto/js:ro
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4e. Gateway — HTTP + WebSocket API
  ditto-gateway:
    image: docker.io/eclipse/ditto-gateway:3.5.0
    container_name: ditto-gateway
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - TZ=Europe/Rome
      - BIND_HOSTNAME=0.0.0.0
      - ENABLE_PRE_AUTHENTICATION=true
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=75 -Dpekko.remote.artery.canonical.hostname=ditto-gateway -Dpekko.remote.artery.canonical.port=2551 -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-policies:2551 -Dditto.gateway.authentication.devops.password=devops
    depends_on:
      - ditto-policies
      - ditto-things
      - ditto-search
      - ditto-connectivity
    networks:
      iot-net:
        aliases:
          - ditto-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7626/alive"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 120s

  # 4f. Nginx — reverse proxy + basic auth su porta 8080
  nginx:
    image: nginx:1.25-alpine
    container_name: ditto-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.htpasswd:/etc/nginx/nginx.htpasswd:ro
    depends_on:
      - ditto-gateway
    networks:
      - iot-net

# 4g. Ditto-UI — Interfaccia Web su porta 8081
  ditto-ui:
    image: docker.io/eclipse/ditto-ui:3.5.0
    container_name: ditto-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - DITTO_ENDPOINT=http://localhost:8080
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 4h. Smart Park UI — Mappa sensori
  #     Porta 8090 (nginx static)
  # ─────────────────────────────────────────
  smart-park-ui:
    image: nginx:1.25-alpine
    container_name: smart-park-ui
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./smart-park-ui:/usr/share/nginx/html:ro
      - ./smart-park-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 5. INFLUXDB — Time-Series Storage
  #    Porta 8086 (HTTP API + UI)
  # ─────────────────────────────────────────

  # ─────────────────────────────────────────
  # 6. TELEGRAF — Bridge MQTT → InfluxDB
  #    Si iscrive ai topic MQTT e scrive su InfluxDB
  # ─────────────────────────────────────────

  # ─────────────────────────────────────────
  # 7. GRAFANA — Dashboard
  #    Porta 3000
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 8. MQTT EXPLORER — Debug UI
  #    Porta 4000
  # ─────────────────────────────────────────
  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer
    container_name: mqtt-explorer
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      - iot-net

#─── Node-RED (Simulatore Sensori MQTT) ──────────
  nodered:
    image: nodered/node-red:latest
    restart: always
    ports:
      - "1880:1880"
    volumes:
      - ./nodered_data:/data
      - ./mappers/commonjs:/data/mappers
      - ./data:/data/smartpark
    networks:
      iot-net:
        aliases:
          - nodered
    environment:
      - TZ=Europe/Rome

  smartpark-api:
    build: ./smartpark-api
    container_name: smartpark-api
    restart: unless-stopped
    ports:
      - "8091:3001"
    volumes:
      - ./data:/app/data                              # modelli JSON + template + admin-ui.html
      - ./mappers/commonjs:/app/mappers/commonjs       # output bundler → ditto-connectivity lo legge
    environment:
      - PORT=3001
      - DITTO_URL=http://nginx:80
      - DITTO_USER=ditto
      - DITTO_PASSWORD=ditto
      - DITTO_DEVOPS_USER=devops
      - DITTO_DEVOPS_PASSWORD=devops
      - DITTO_NS=smartpark
      - DITTO_CONN_ID=smartpark-mqtt-connection
      - MAPPER_DEF_ID=custom-js-mapper
      - MODELS_DIR=/app/data/sensors models
      - TEMPLATE_PATH=/app/data/mapper-template.js
      - MAPPER_OUT=/app/mappers/commonjs/smartpark-mapper.js
      - ADMIN_UI_PATH=/app/data/admin-ui.html
    depends_on:
      - nginx
    networks:
      - iot-net

  # ─────────────────────────────────────────
  # 9. DASHBOARD BACKEND — FastAPI API
  #    Porta 8000
  # ─────────────────────────────────────────
