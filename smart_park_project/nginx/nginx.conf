worker_processes 1;

events { worker_connections 1024; }

http {
    upstream ditto-gateway {
        server ditto-gateway:8080;
    }

    server {
        listen 80;

        # Basic auth (utenti in nginx.htpasswd)
        auth_basic           "Ditto - Smart Park";
        auth_basic_user_file /etc/nginx/nginx.htpasswd;

        # Passa l'utente autenticato a Ditto come pre-autenticazione
        location / {
            # CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-ditto-pre-authenticated' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-ditto-pre-authenticated' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass         http://ditto-gateway;
            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Passa l'utente Basic Auth a Ditto
            proxy_set_header   x-ditto-pre-authenticated "nginx:${remote_user}";
        }
    }
}
